name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Keep in step with .github/workflows/ci.yml
  GO_VERSION: "1.26.5"
  NODE_VERSION: "22"
  # Keep in step with web/package.json "packageManager" (repo root has no package.json).
  PNPM_VERSION: "11.18.0"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser needs full history for changelog

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # pnpm + Node are required because goreleaser's before.hooks build the
      # frontend. Without this, `pnpm --dir web build` in .goreleaser.yaml
      # fails and no binary ships with the dashboard.
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
