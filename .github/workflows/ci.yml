name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch; only the latest commit matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with .github/workflows/release.yml
  GO_VERSION: "1.26.5"
  NODE_VERSION: "22"
  # Keep in step with web/package.json "packageManager" (repo root has no package.json).
  PNPM_VERSION: "11.18.0"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  # Keep in step with mise.toml and the Makefile — see
  # docs/decisions/0005-mise-optional.md.
  TRIVY_VERSION: "v0.72.0"
  # Keep in step with the Makefile, and with the version the golden fixture at
  # internal/scan/trufflehog/testdata was captured from.
  TRUFFLEHOG_VERSION: "v3.96.0"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The Go build embeds web/dist. Tests do not need the real UI, but the
      # embed directive must resolve, which the committed .gitkeep guarantees.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Lint install script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/install.sh

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # TanStack Router generates routeTree.gen.ts during the Vite build. CI
      # must produce it before typecheck; the file is gitignored locally too.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Pinned by version rather than tracking latest: Trivy's release channel
      # was compromised twice in 2026, and its report schema is a contract we
      # parse. See docs/decisions/0002-trivy-subprocess.md.
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin ${{ env.TRIVY_VERSION }}
          trivy --version

      # Installed, unlike OSV-Scanner and Opengrep, because the secrets adapter
      # would otherwise ship with no end-to-end coverage at all: it is the only
      # adapter whose output is derived from a digest rather than copied from the
      # tool, so "does it actually produce findings" is not something the unit
      # tests can answer.
      #
      # Note this runs unverified. Turning on --verify-secrets in CI would send
      # the fixture's credentials to third-party APIs on every push, which is
      # exactly what ADR 0008 makes opt-in.
      - name: Install TruffleHog
        run: |
          curl -sfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin ${{ env.TRUFFLEHOG_VERSION }}
          trufflehog --version

      - name: Build full binary
        run: |
          pnpm --dir web install --frozen-lockfile
          make build

      - name: Scan the fixture in every format
        run: |
          ./bin/pindrop scan ./testdata/vulnerable-app
          ./bin/pindrop scan ./testdata/vulnerable-app --format json --out /tmp/report.json
          ./bin/pindrop scan ./testdata/vulnerable-app --format sarif --out /tmp/report.sarif

      # The fixture contains no detectable credential by design, so the step above
      # never exercises the secrets path. This one does, against credentials
      # generated into a temp directory and destroyed with it.
      #
      # Two assertions, and the second is the one that matters: findings must
      # appear at all, and no plaintext may reach the report. The adapter derives
      # its snippet from a digest rather than copying the tool's output, so
      # "did a secret leak into the JSON" is not a question the unit tests can
      # answer about a real run.
      - name: Secrets path must find credentials and leak none
        run: |
          make run-scan-secrets | tee /tmp/secrets.out
          grep -q 'category: secret\|secret ' /tmp/secrets.out \
            || { echo "expected secret findings"; cat /tmp/secrets.out; exit 1; }

          dir=$(mktemp -d)
          key="AKIA$(LC_ALL=C tr -dc 'A-Z0-9' </dev/urandom | head -c 16)"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$key" >"$dir/.env"
          printf 'GITHUB_TOKEN=ghp_%s\n' \
            "$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 36)" >>"$dir/.env"

          ./bin/pindrop scan "$dir" --format json --out /tmp/secrets.json
          test "$(jq '[.findings[]|select(.category=="secret")]|length' /tmp/secrets.json)" -gt 0

          # The digest must have replaced the credential, not accompanied it.
          if grep -qF "$key" /tmp/secrets.json; then
            echo "plaintext credential reached the report"; exit 1
          fi
          jq -e '[.findings[]|select(.scanner=="trufflehog")
                 |select(.location.snippet|startswith("sha256:"))]|length > 0' \
            /tmp/secrets.json >/dev/null
          rm -rf "$dir"

      - name: Fingerprints must be stable across runs
        run: |
          ./bin/pindrop scan ./testdata/vulnerable-app --format json --out /tmp/a.json
          ./bin/pindrop scan ./testdata/vulnerable-app --format json --out /tmp/b.json
          diff <(jq -S '[.findings[].fingerprint] | sort' /tmp/a.json) \
               <(jq -S '[.findings[].fingerprint] | sort' /tmp/b.json)

      - name: Serve and probe
        run: |
          ./bin/pindrop serve --results /tmp/report.json &
          for _ in $(seq 1 40); do
            curl -sf localhost:7777/api/v1/healthz >/dev/null && break
            sleep 0.25
          done
          curl -sf localhost:7777/api/v1/healthz
          curl -sf localhost:7777/api/v1/summary >/dev/null
          curl -sf localhost:7777/api/v1/findings >/dev/null
          # Deep links must return the SPA shell, not a 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:7777/deep/link)" = "200"

      # Every scanner is named explicitly rather than relying on Trivy being the
      # only one this job installs. The looser form of this test passed only
      # because nothing else happened to be present, so each adapter added made
      # it more misleading: with one scanner still usable the scan correctly
      # succeeds, and the assertion would have started testing the environment
      # instead of the behavior.
      - name: No usable scanner must fail with actionable guidance
        run: |
          if ./bin/pindrop scan ./testdata/vulnerable-app \
               --trivy-binary definitely-not-installed \
               --osv-binary definitely-not-installed \
               --opengrep-binary definitely-not-installed \
               --trufflehog-binary definitely-not-installed 2>/tmp/err; then
            echo "expected a non-zero exit"; exit 1
          fi
          for hint in "Install Trivy" "Install OSV-Scanner" "Install Opengrep" "Install TruffleHog"; do
            grep -q "$hint" /tmp/err || { echo "missing install hint: $hint"; cat /tmp/err; exit 1; }
          done

      # The other half of the contract, and the one that keeps the zero-setup
      # first run working: one absent optional tool reduces coverage, it does not
      # abort the scan. Trivy is the scanner this job installs, so it is the one
      # left usable.
      - name: One missing scanner must warn and keep going
        run: |
          ./bin/pindrop scan ./testdata/vulnerable-app \
            --osv-binary definitely-not-installed \
            --opengrep-binary definitely-not-installed \
            --trufflehog-binary definitely-not-installed >/dev/null 2>/tmp/warn
          grep -q "Skipping unavailable scanners" /tmp/warn \
            || { echo "expected a skip warning:"; cat /tmp/warn; exit 1; }
