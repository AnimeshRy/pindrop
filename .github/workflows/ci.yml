name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch; only the latest commit matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "22"
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The Go build embeds web/dist. Tests do not need the real UI, but the
      # embed directive must resolve, which the committed .gitkeep guarantees.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Check go.mod is tidy
        run: go mod tidy -diff

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Pinned by version rather than tracking latest: Trivy's release channel
      # was compromised twice in 2026, and its report schema is a contract we
      # parse. See docs/decisions/0002-trivy-subprocess.md.
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.72.0
          trivy --version

      - name: Build full binary
        run: |
          pnpm --dir web install --frozen-lockfile
          make build

      - name: Scan the fixture in every format
        run: |
          ./bin/pindrop scan ./testdata/vulnerable-app
          ./bin/pindrop scan ./testdata/vulnerable-app --format json --out /tmp/report.json
          ./bin/pindrop scan ./testdata/vulnerable-app --format sarif --out /tmp/report.sarif

      - name: Fingerprints must be stable across runs
        run: |
          ./bin/pindrop scan ./testdata/vulnerable-app --format json --out /tmp/a.json
          ./bin/pindrop scan ./testdata/vulnerable-app --format json --out /tmp/b.json
          diff <(jq -S '[.findings[].fingerprint] | sort' /tmp/a.json) \
               <(jq -S '[.findings[].fingerprint] | sort' /tmp/b.json)

      - name: Serve and probe
        run: |
          ./bin/pindrop serve --results /tmp/report.json &
          for _ in $(seq 1 40); do
            curl -sf localhost:7777/api/v1/healthz >/dev/null && break
            sleep 0.25
          done
          curl -sf localhost:7777/api/v1/healthz
          curl -sf localhost:7777/api/v1/summary >/dev/null
          curl -sf localhost:7777/api/v1/findings >/dev/null
          # Deep links must return the SPA shell, not a 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:7777/deep/link)" = "200"

      - name: Missing Trivy must fail with actionable guidance
        run: |
          if ./bin/pindrop scan ./testdata/vulnerable-app --trivy-binary definitely-not-installed 2>/tmp/err; then
            echo "expected a non-zero exit"; exit 1
          fi
          grep -q "Install Trivy" /tmp/err || { echo "missing install hint:"; cat /tmp/err; exit 1; }
