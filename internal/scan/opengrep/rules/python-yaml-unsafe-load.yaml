rules:
  - id: py-yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: >-
      yaml.load without a safe loader constructs arbitrary Python objects from
      the document, which is remote code execution on untrusted input. Use
      yaml.safe_load, or pass Loader=yaml.SafeLoader.
    metadata:
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [python, pyyaml]
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      owasp:
        - "A08:2021 - Software and Data Integrity Failures"
      references:
        - https://cwe.mitre.org/data/definitions/502.html
        - https://pyyaml.org/wiki/PyYAMLDocumentation
    patterns:
      - pattern-either:
          - pattern: yaml.load(...)
          - pattern: yaml.unsafe_load(...)
          - pattern: yaml.full_load(...)
      - pattern-not: yaml.load($X, Loader=yaml.SafeLoader)
      - pattern-not: yaml.load($X, Loader=yaml.CSafeLoader)
      - pattern-not: yaml.load($X, yaml.SafeLoader)
      - pattern-not: yaml.load($X, yaml.CSafeLoader)
