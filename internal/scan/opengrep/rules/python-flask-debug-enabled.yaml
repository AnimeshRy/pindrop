rules:
  - id: py-flask-debug-enabled
    languages: [python]
    severity: WARNING
    message: >-
      Flask is started with debug=True, which serves the Werkzeug debugger. Its
      interactive console executes arbitrary Python on any unhandled exception,
      so a single traceback becomes remote code execution. Drive this from an
      environment variable that is off in production.
    metadata:
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [python, flask]
      cwe:
        - "CWE-489: Active Debug Code"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      references:
        - https://cwe.mitre.org/data/definitions/489.html
        - https://flask.palletsprojects.com/en/stable/debugging/
    pattern-either:
      - pattern: $APP.run(..., debug=True, ...)
      - pattern: $APP.run(..., use_reloader=True, use_debugger=True, ...)
